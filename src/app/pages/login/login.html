<main class="login-page">
  <section class="login-shell" aria-labelledby="login-title">
    <div class="brand-panel">
      <div class="brand-mark" aria-hidden="true">P</div>

      <div>
        <p class="eyebrow">Pyst workspace</p>
        <h1 id="login-title">Iniciar sesion</h1>
        <p class="intro">
          Accede a tu panel para revisar tu actividad y mantener tu cuenta sincronizada.
        </p>
      </div>

      <div class="preview" aria-hidden="true">
        <div class="preview-header">
          <span></span>
          <span></span>
          <span></span>
        </div>
        <div class="preview-chart">
          <span style="--bar-height: 46%"></span>
          <span style="--bar-height: 72%"></span>
          <span style="--bar-height: 58%"></span>
          <span style="--bar-height: 86%"></span>
          <span style="--bar-height: 64%"></span>
        </div>
      </div>
    </div>

    <div class="login-panel">
      <p class="panel-kicker">Bienvenido</p>
      <h2>Continua con tu cuenta</h2>
      <p class="panel-copy">Usa Google para entrar de forma rapida y segura.</p>

      <div class="google-button-wrap">
        <div #googleButton></div>
      </div>
    </div>
  </section>
</main>
